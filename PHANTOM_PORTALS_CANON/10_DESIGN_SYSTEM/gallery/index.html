  .g-shell__body { display: grid; grid-template-columns: var(--rail-width) 1fr; min-height: 0; }
  .g-shell__work { padding: var(--space-24); display: grid; gap: var(--space-16); align-content: start; background: var(--surface-canvas); }
  .g-omnirow { display: flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-8); background: var(--surface-primary); border-bottom: 1px solid var(--border-default); min-height: var(--omnibox-height); }

  @media (max-width: 767px) {

          h(P.UtilityRail, { activeId: active[0], onSelect: active[1], items: [{ id: 'cc', label: 'Command Center', icon: 'home-portal' }, { id: 'dg', label: 'Diagnostics', icon: 'diagnostics' }, { id: 'tm', label: 'Terminal', icon: 'terminal' }, { id: 'ai', label: 'AI Core', icon: 'ai-core' }, 'separator', { id: 'st', label: 'Settings', icon: 'settings' }] }),
          h('div', { className: 'g-shell__work' },
            h(P.PhantomHero, { eyebrow: 'OFFLINE-FIRST IT COMMAND CENTER', title: 'Enter the', accent: 'Portal', description: 'Diagnose, repair and recover machines from one portable toolkit.',
              actions: h(P.Button, { variant: 'primary', size: 'lg', icon: 'diagnostics' }, 'Run Diagnostics') }),
            h(P.Omnibox, { label: 'Ask Phantom or run a command', icon: 'ai-core', placeholder: 'Ask Phantom, or type > to run a command', shortcut: 'CTRL K' })))));
  }

  function Assets() {
    var show = CATALOG.assets.filter(function (a) { return /^30_ASSETS\/(brand|textures|hud-geometry)\//.test(a.path); });
    return h(Section, { id: 'assets', eyebrow: '08 — Brand & art', title: 'Ink Protocol assets',
      intro: CATALOG.count + ' files catalogued in 30_ASSETS/INDEX.json (generated). Each has a sidecar with origin, licence, SHA-256 and usage rules. At most three vectors per composition, one crimson; pair each chaos mark with a precision mark.' },
      h('div', { className: 'g-grid' }, show.map(function (a) {
        var dark = /inverse|app-icon/.test(a.path);
        return h('div', { className: 'g-card', key: a.path },
          h('div', { className: 'g-art' + (dark ? ' g-art--dark' : '') }, h('img', { src: '../../' + a.path, alt: a.title, loading: 'lazy' })),
          h('h3', null, a.title),
          h('span', { className: 'g-code' }, a.id + ' · ' + a.status + ' · ' + (a.dimensions || '') + ' · ' + Math.round(a.bytes / 1024) + ' KB'),
          h('span', { className: 'g-code' }, a.path.replace('30_ASSETS/', '')));
      })));
  }

  function App() {
    var nav = [['color', 'Colour', 'cloud'], ['type', 'Typography', 'terminal'], ['space', 'Space & depth', 'tools'], ['icons', 'Icons', 'search'],
      ['components', 'Components', 'cpu'], ['status', 'Status', 'check'], ['shell', 'Shell', 'home-portal'], ['assets', 'Brand & art', 'bookmark']];
    return h(P.PortalRoot, null,
      h('div', { className: 'g-wrap' },
        h('header', { className: 'g-head' },
          h('img', { src: ASSETS + 'brand/logo/polka-lockup-horizontal.svg', alt: 'Polka Portals' }),
          h('div', { className: 'g-meta' }, 'DESIGN SYSTEM GALLERY · CANON 1.3.1', h('br'), 'TOKENS v2 · OFFLINE · ' + TOKENS.length + ' TOKENS')),
        h('div', { className: 'g-nav' }, h(P.BookmarksBar, { items: nav.map(function (n) { return { label: n[1], href: '#' + n[0], icon: n[2] }; }) })),
        h('main', null, h(Colors), h(Type), h(Scale), h(Icons), h(Components), h(Status), h(Shell), h(Assets)),
        h('footer', { className: 'g-foot' }, 'Generated views of 10_DESIGN_SYSTEM/tokens/tokens.json and 30_ASSETS/INDEX.json. Rebuild with 80_TOOLS/build-tokens and index-assets; validate with 80_TOOLS/validate-canon.py.')));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
