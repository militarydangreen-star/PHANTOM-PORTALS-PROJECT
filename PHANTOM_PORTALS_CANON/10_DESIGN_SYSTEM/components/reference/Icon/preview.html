<!-- @dsCard group="Actions" height=188 subtitle="All 20 icons, one ink" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:grid;gap:16px}</style></head>
<body><div id="root" class="pp" style="padding:24px;background:var(--surface-canvas)"></div>
<script>
var P = window.PhantomPortals, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById("root")).render(
h('div', {className:'stack'},
  h('div', {className:'row', style:{gap:20}}, Object.keys(P.iconUrls).map(function(n){ return h('span', {key:n, title:n, style:{display:'inline-grid', placeItems:'center', width:40, height:40}}, h(P.Icon, {name:n, size:24})) })),
  h('div', {className:'row', style:{gap:20, color:'var(--accent-crimson)'}}, ['alert','check','close','power','shield'].map(function(n){ return h(P.Icon, {key:n, name:n, label:n}) })))
);
</script>
</body></html>
