<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:grid;gap:16px}</style></head>
<body><div id="root" class="pp" style="padding:24px;background:var(--surface-canvas)"></div>
<script>
var P = window.PhantomPortals, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById("root")).render(
h('div', {style:{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:16}},
  h(P.ToolTile, {icon:'diagnostics', feature:true, title:'Hardware Diagnostics', description:'SMART, memory and thermal checks.', meta:'MOD-01 · VERIFIED', current:true}),
  h(P.ToolTile, {icon:'network', feature:true, title:'Network Repair', description:'Winsock, DNS and adapter resets.', meta:'MOD-02 · 14 SCRIPTS'}),
  h(P.ToolTile, {icon:'shield', feature:true, title:'Security Sweep', description:'Defender, startup and persistence audit.', meta:'MOD-03 · OFFLINE'}))
);
</script>
</body></html>
