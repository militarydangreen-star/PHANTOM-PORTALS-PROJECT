<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--surface-canvas)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stack{display:grid;gap:16px}</style></head>
<body><div id="root" class="pp" style="padding:24px;background:var(--surface-canvas)"></div>
<script>
var P = window.PhantomPortals, h = React.createElement, F = React.Fragment;
ReactDOM.createRoot(document.getElementById("root")).render(
h('div', {className:'stack'},
  h(P.Toggle, {label:'Offline mode', defaultChecked:true}),
  h(P.Toggle, {label:'Telemetry overlay'}),
  h(P.Toggle, {label:'Cloud sync', disabled:true, stateText:'NOT CONFIGURED'}))
);
</script>
</body></html>
