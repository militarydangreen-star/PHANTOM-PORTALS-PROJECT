  <title>Polka Portals — lower third 1920×1080 (PP-TPL-002)</title>
  <desc>Transparent background for video editors. Black plate with a dry-brush crimson spine that breaks out above the plate; name in white (18.2:1), role in on-inverse-secondary (8.61:1). Crimson stays on the spine only — crimson text on black is forbidden (2.26:1). Edit the TEXT layer; GUIDES (hidden) shows title-safe. Motion: see 30_ASSETS/video/lower-thirds/README.md.</desc>
  <style>
    @font-face { font-family: "Inter"; font-weight: 400; src: url("../../fonts/inter/inter-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 600; src: url("../../fonts/inter/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Space Grotesk"; font-weight: 600; src: url("../../fonts/space-grotesk/space-grotesk-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("../../fonts/space-grotesk/space-grotesk-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("../../fonts/jetbrains-mono/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
    .display { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 700; letter-spacing: -0.02em; }
    .heading { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 600; }
    .body { font-family: "Inter", sans-serif; font-weight: 400; }
    .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  </style>
